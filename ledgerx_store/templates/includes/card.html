{% macro card(it) %}
<a class="lx-card" href="/product/{{ it.slug }}">
  <div class="ph">{% if it.image %}<img src="{{ it.image }}" alt="" loading="lazy">{% else %}<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>{% endif %}</div>
  <div class="tx"><b>{{ it.name }}</b>{% if it.detail %}<small>{{ it.detail }}</small>{% endif %}</div>
  <div class="price"><span>{{ money(it.price) }}</span><em class="{{ 'in' if it.in_stock else 'out' }}">{{ _("In stock") if it.in_stock else _("Out of stock") }}</em></div>
</a>
{% endmacro %}
