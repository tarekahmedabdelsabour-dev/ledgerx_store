{% extends "ledgerx_store/templates/store_base.html" %}
{% block page_content %}
{% autoescape true %}
<article class="lx-article">
  <h1>{{ page_doc.title }}</h1>
  {% if page_doc.image %}<p><img src="{{ page_doc.image }}" alt=""></p>{% endif %}
  <div class="body">{{ (page_doc.body or "") | safe }}</div>
</article>
{% endautoescape %}
{% endblock %}
