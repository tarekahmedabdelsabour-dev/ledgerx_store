{% extends "ledgerx_store/templates/store_base.html" %}
{% block page_content %}
<article class="lx-article">
  <h1>{{ post.title }}</h1>
  <p class="lx-muted">{{ frappe.format_date(post.published_on) }}</p>
  {% if post.meta_image %}<p><img src="{{ post.meta_image }}" alt=""></p>{% endif %}
  <div class="body">{{ body | safe }}</div>
  <p><a href="/news">{{ _("All news") }}</a></p>
</article>
{% endblock %}
