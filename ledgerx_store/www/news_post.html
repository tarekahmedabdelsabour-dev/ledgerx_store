{% extends "ledgerx_store/templates/store_base.html" %}
{% block page_content %}
{% autoescape true %}
<article class="lx-article">
  <h1>{{ post.title }}</h1>
  <p class="lx-muted">{{ frappe.format_date(post.published_on) }}</p>
  {% if post.image %}<p><img src="{{ post.image }}" alt=""></p>{% endif %}
  <div class="body">{{ (post.body or "") | safe }}</div>
  <p><a href="/news">{{ _("All news") }}</a></p>
</article>
{% endautoescape %}
{% endblock %}
